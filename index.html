<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eef" />
    <link rel="icon" href="favicon.svg" type="image/x-icon">
    <title>codebehind </title>
    <script src='codebehind.js' defer></script>
  </head>
  <body>
    <section>
      <a href="page1">page1</a>
      <a href="page2">page2</a>
    </section>
    <code-behind>here</code-behind>

    <script>
      // handle event

      let eventFn = null;

      function clickEvents(){
        console.log(`clickEvents`);

        eventFn();
      }

    </script>

    <script>
      // have to leave this here for now as vite keeps causing an error
      // the navigation api needs to be 'switched on' in Safari Settings->FeatureFlags
      // the nav is where each page to display
      // they (currently) need a function called page to operate
      // page receives a callback function thay does nothing so far
      

      // this is messy for the renderer to be called
      let render = {};

      import('./renderer.js').then(
        module => {
          render = module['renderer']().render;
        });
      
      // these will be the modules loaded ie modules[].page()
      let modules={};
      const nav={
        'page1': './page1.js',
        'page2': './page2.js',
      };

      // the actual page loader
      for(n in nav){
        
        let i = 0;
        let name=n;
        import(nav[n]).then(module => {
          //module['page']();
          modules[name]={...module};
        });
      }

      // this is the navigation interceptor
      navigation.addEventListener("navigate", event => {

        //cross-origin navs
        if (!event.canIntercept) {
          return;
        }
        // fragment navigations or downloads.
        if (event.hashChange || event.downloadRequest !== null) {
          return;
        }

        const url=new URL(event.destination.url);
        const name = url.pathname.replace("/","");
        console.log(`url=${url}, name=${name}`);

        event.intercept({

          async handler() {

            const page = modules[name].page();

            const renderHtml = page.render();
            eventFn = page.events;

            const cb = document.querySelector('code-behind');
            console.log(`renderHtml=${renderHtml}`);
            cb.innerHTML = render(renderHtml);
          }
        }) // need to add the error handler

      });

    </script>

</body>
</html>
